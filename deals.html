<!DOCTYPE html>
<html lang = "en">
    <head>
        <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel = "stylesheet" href = "deals.css">
        <title>E-commerce</title>
    </head>
    <body>
        <div class="container">
            <h1 class="text-center my-4">Exciting Deals Just for You!</h1>
            <div class="row" id="deals-container">
                <div id="carouselExampleControls" class="carousel slide" data-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                        <img src="megasavings.jpg" class="d-block w-100" alt="mega savings">
                        </div>
                        <div class="carousel-item">
                        <img src="electronics.jpg" class="d-block w-100" alt="electronics">
                        </div>
                        <div class="carousel-item">
                        <img src="fashion.jpg" class="d-block w-100" alt="fashion">
                        </div>
                        <div class="carousel-item">
                        <img src="home.jpg" class="d-block w-100" alt="home and kitchen">
                        </div>
                        <div class="carousel-item">
                        <img src="beauty.jpg" class="d-block w-100" alt="beauty and self-care">
                        </div>
                    </div>
                    <a class="carousel-control-prev" href="#carouselExampleControls" role="button" data-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="sr-only">Previous</span>
                    </a>
                    <a class="carousel-control-next" href="#carouselExampleControls" role="button" data-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="sr-only">Next</span>
                    </a>
                </div>
            </div>
        </div>
        <div class="deals-cards my-4">
            <h2 class="text-center mb-4">Featured Deals</h2>
            <div class="row" id="deals-container">
                <!-- Deals will be dynamically inserted here -->
            </div>
        </div>
        <script src="deals.js"></script>
    </body>
